<!DOCTYPE html>

                <li><a href="kontak.html" class="active">Kontak</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <h1>Hubungi Saya</h1>
            <p>Mari terhubung dan berkolaborasi</p>
        </div>

        <div class="contact-wrapper">
            <div class="contact-info">
                <div class="contact-item">
                    <div class="contact-icon">📧</div>
                    <div>
                        <h3>Email</h3>
                        <p><a href="mailto:slmnh66@gmail.com">slmnh66@gmail.com</a></p>
                    </div>
                </div>

                <div class="contact-item">
                    <div class="contact-icon">📱</div>
                    <div>
                        <h3>Telepon</h3>
                        <p>+62 812-3456-7890</p>
                    </div>
                </div>

                <div class="contact-item">
                    <div class="contact-icon">📍</div>
                    <div>
                        <h3>Lokasi</h3>
                        <p>Jakarta, Indonesia</p>
                    </div>
                </div>
            </div>

            <div class="social-section">
                <h2>Media Sosial</h2>
                <div class="social-links">
                    <a href="https://facebook.com/slmnh66" target="_blank" class="social-link">
                        <div class="social-icon">📘</div>

                    </a>
                    <a href="https://instagram.com/slmnh66" target="_blank" class="social-link">

                    <a href="https://youtube.com/slmnh66" target="_blank" class="social-link">

            <div class="contact-form">
                <h2>Kirim Pesan</h2>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="name">Nama</label>
                        <input type="text" id="name" name="name" required>
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="message">Pesan</label>
                        <textarea id="message" name="message" rows="5" required></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Kirim Pesan</button>
                </form>
            </div>
        </div>
    </div>
